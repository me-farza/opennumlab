[workspace]
members = ["crates/mathlab-engine", "crates/mathlab-cli", "crates/mathlab-desktop", "crates/mathlab-language", "crates/mathlab-debugger"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "__screenshot"] }
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mathlab-engine = { path = "crates/mathlab-engine" }
mathlab-language = { path = "crates/mathlab-language" }
mathlab-debugger = { path = "crates/mathlab-debugger" }

[profile.release]
lto = "thin"
codegen-units = 1

